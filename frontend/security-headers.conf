# Included in every location: nginx drops server-level add_header lines in a
# location that has add_header lines of its own.
#
# CSP: scripts only from this origin; inline styles because MUI (emotion)
# injects <style> tags; images from the API, data: and blob: (previews);
# frames: the Google Maps embed on a business page, and a hero's background
# video from YouTube (privacy-enhanced domain) or Vimeo — the only two the
# homepage builder accepts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
