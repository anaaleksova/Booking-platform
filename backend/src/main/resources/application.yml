spring:
  application:
    name: booking-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DATABASE_USERNAME:booking}
    password: ${DATABASE_PASSWORD:booking}
    hikari:
      pool-name: booking-pool
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Schema ownership belongs to Liquibase; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # NOTE: hibernate.jdbc.time_zone is deliberately NOT set.
          #
          # It makes the JDBC driver convert *every* temporal value through the
          # given zone, including plain TIME columns. Working hours are
          # wall-clock ("Monday 09:00" means 09:00 to the business, in every
          # season), so converting them shifts opening hours by the server's
          # offset. Instants are stored in TIMESTAMPTZ columns, which are
          # unambiguous on their own and need no such help.
          batch_size: 25
        # Lazy collections (a reservation's resources) load in batches, so a
        # calendar month costs a few queries rather than one per reservation.
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Changesets tagged with a context (the demo seed is "dev") only run when
    # that context is active. "none" matches no tagged changeset, so the
    # default profile gets the schema and nothing else.
    contexts: ${LIQUIBASE_CONTEXTS:none}

  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:1025}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_AUTH:false}
          starttls:
            enable: ${EMAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Image uploads; MediaService enforces the same 5 MB per file.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  jwt:
    # Overridden in every real environment. Minimum 32 characters.
    secret: ${JWT_SECRET:local-development-only-secret-please-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    issuer: booking-platform
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  notifications:
    from-address: ${EMAIL_FROM:no-reply@bookingplatform.local}
    enabled: ${NOTIFICATIONS_ENABLED:true}
    # How often the outbox worker drains pending notifications.
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:30000}
    reminder-scan-interval-ms: ${NOTIFICATION_REMINDER_INTERVAL_MS:300000}
  integrations:
    # Where automation tools reach this API; shown on Admin -> Integrations.
    public-api-url: ${INTEGRATIONS_PUBLIC_API_URL:http://localhost:8080}
    events-enabled: ${INTEGRATION_EVENTS_ENABLED:true}
    dispatch-interval-ms: ${INTEGRATION_DISPATCH_INTERVAL_MS:10000}
    # Set true in production: stops tenants pointing webhooks at internal addresses.
    block-private-webhooks: ${INTEGRATIONS_BLOCK_PRIVATE_WEBHOOKS:false}

logging:
  level:
    root: INFO
    com.bookingsaas: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}%X{integration:-}] %logger{36} - %msg%n"
