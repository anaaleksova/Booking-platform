# ---------------------------------------------------------------------------
# Liquibase master changelog.
#
# Changesets are plain SQL ("formatted SQL") so the schema reads exactly as
# PostgreSQL will run it — the exclusion constraints and partial indexes that
# prevent double booking have no portable Liquibase equivalent anyway.
#
# Never edit a changeset that has been applied somewhere; add a new file.
# ---------------------------------------------------------------------------
