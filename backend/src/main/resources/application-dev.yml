# Local development profile.
# Activates the "dev" Liquibase context, which adds the demo seed so the app is
# usable immediately on startup.
spring:
  liquibase:
    contexts: dev

app:
  jwt:
    # Only ever accepted with the dev or test profile active.
    secret: ${JWT_SECRET:local-development-only-secret-please-change-me}

# API documentation is off by default and on for local development.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    com.bookingsaas: DEBUG
    org.hibernate.SQL: INFO
